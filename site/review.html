<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確かめる一覧｜まちしるべ</title>
<meta name="description" content="まちしるべで、人が確かめる答えの一覧。自動で承認したものの件数と、人が見た理由。">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="town.css">
</head>
<body class="town-page">
<header class="town-head">
  <nav class="town-path" aria-label="いま見ている所"><ol><li><a href="./">日本</a></li><li><span>確かめる一覧</span></li></ol></nav>
  <h1>確かめる一覧</h1>
  <p id="mode" class="where"></p>
</header>
<main class="town-main">
  <section class="block">
    <h2>件数</h2>
    <ul id="counts" class="counts"></ul>
  </section>
  <section class="block">
    <h2 id="pending-title">確かめ待ち</h2>
    <div id="pending"></div>
  </section>
  <section class="block">
    <h2>決めたもの</h2>
    <div id="decided"></div>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<footer class="town-foot"><a href="./">← 日本地図に戻る</a></footer>
<script src="review.js"></script>
</body>
</html>
