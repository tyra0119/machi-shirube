<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確かめる一覧｜まちしるべ</title>
<meta name="description" content="まちしるべで、人が確かめる答えの一覧。自動で承認したものの件数と、人が見た理由。">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="town.css">
</head>
<body class="town-page">
<header class="town-head">
  <nav class="town-path" aria-label="いま見ている所"><ol><li><a href="./">日本</a></li><li><span>確かめる一覧</span></li></ol></nav>
  <h1>確かめる一覧</h1>
  <p id="mode" class="where"></p>
</header>
<main class="town-main">
  <section class="block">
    <div id="ai-box" class="sites-box pub-box" hidden></div>
    <div id="publish" class="sites-box pub-box" hidden></div>
    <div class="r-tabs" role="tablist" aria-label="一覧を切りかえる">
      <button type="button" role="tab" data-tab="pending" aria-selected="true">確かめ待ち <strong id="n-pending">0</strong></button>
      <button type="button" role="tab" data-tab="decided" aria-selected="false">決めたもの <strong id="n-decided">0</strong></button>
      <button type="button" role="tab" data-tab="auto" aria-selected="false">自動で承認 <strong id="n-auto">0</strong></button>
    </div>
    <label class="field r-filter">町で絞る<select id="town-filter"></select></label>
    <div id="sites" class="sites-box" hidden></div>
    <div id="cards" class="sites-box cards-box" hidden></div>
    <p id="summary" class="note"></p>
    <div id="list" class="r-list"></div>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<footer class="town-foot"><a href="./">← 日本地図に戻る</a></footer>
<script src="text.js"></script>
<script src="review.js"></script>
</body>
</html>
