<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まちしるべ</title>
<meta name="description" content="町を選ぶと、その町で暮らしの情報が届きにくい人に届くページを、出典つきで作ります。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>まちしるべ</h1>
  <div class="search">
    <input id="search" type="search" placeholder="町の名前で探す（例：黒潮町、上津台）" autocomplete="off"
      role="combobox" aria-expanded="false" aria-controls="results" aria-label="町の名前で探す">
    <ul id="results" class="results" role="listbox" hidden></ul>
  </div>
  <p class="lead">または地図で町を押す</p>
</header>
<main>
  <div id="map" aria-label="日本の市区町村の地図"></div>
  <div id="tip" class="tip" hidden></div>
  <button id="basemap" type="button" class="basemap" aria-pressed="true">背景の地図：表示中</button>
  <nav id="crumb" class="crumb" hidden>
    <button type="button" class="back" aria-label="市区町村の地図に戻る">← 戻る</button>
    <span class="here"></span>
  </nav>
  <section id="card" class="card" hidden aria-live="polite"></section>
  <p class="source">町の形：国土数値情報（行政区域データ、2026年1月1日）国土交通省 を加工して作成（CC BY 4.0）／背景：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（淡色地図。拡大したとき）</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="map-buttons.js"></script>
<script src="app.js"></script>
</body>
</html>
