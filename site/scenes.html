<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まちしるべ｜動画の場面（録画用）</title>
<style>
  /* 録画用の場面のページ（フル HD で録る）。冒頭の飛行（flyover.html）と同じ夜の紺色。
     ?scene=card（公式の資料の1行が光って、答えのカードになる）／grid（物差しのます目が埋まっていく）／num（大きな数）／bar（棒が伸びる）
     押すか ?auto で始まる。R でやり直す。文字は画面の幅に合わせた大きさ */
  :root { --bg: #071423; --ink: #f4f1ea; --sub: rgba(244, 241, 234, 0.62); --line: rgba(244, 241, 234, 0.16); --accent: #ffb547; --ok: #5fc59b; --paper: #f7f3ea; --paper-ink: #2b2a27; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif; }
  .stage { position: absolute; inset: 0; }
  .badge { position: absolute; top: 2.2vw; right: 2.4vw; z-index: 5; padding: 0.4vw 1.1vw; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; color: rgba(255, 255, 255, 0.8); font-size: max(14px, 1.1vw); }
  .cap { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; opacity: 0; transition: opacity 0.9s ease; }
  .cap.on { opacity: 1; }
  .cap .s { display: block; font-size: max(20px, 1.6vw); letter-spacing: 0.25em; color: var(--accent); margin-bottom: 0.6vw; }
  .cap .l { display: block; font-size: max(40px, 3.1vw); font-weight: 700; letter-spacing: 0.05em; }
  .start { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .start button { padding: 14px 32px; border: 0; border-radius: 999px; background: var(--accent); color: #1a1205; font-size: 20px; font-weight: 700; cursor: pointer; }
  .start[hidden] { display: none; }

  /* card：公式の資料の表 → 光る1行 → 答えのカード */
  .doc { position: absolute; left: 7vw; top: 12vh; width: 44vw; padding: 2.2vw 2.4vw; border-radius: 0.6vw; background: var(--paper); color: var(--paper-ink); box-shadow: 0 1.5vw 4vw rgba(0, 0, 0, 0.45); transform: translateY(3vh) rotate(-1.2deg); opacity: 0; transition: opacity 1s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1); }
  .doc.on { opacity: 1; transform: translateY(0) rotate(-1.2deg); }
  .doc .dt { margin: 0; font-size: max(15px, 1.15vw); font-weight: 700; }
  .doc .dp { margin: 0.3vw 0 1.2vw; font-size: max(12px, 0.9vw); color: #6b675e; }
  .doc table { width: 100%; border-collapse: collapse; font-size: max(13px, 1.02vw); }
  .doc th, .doc td { padding: 0.55vw 0.6vw; border-bottom: 1px solid #d9d2c3; text-align: left; white-space: nowrap; }
  .doc th { font-size: max(11px, 0.82vw); color: #6b675e; font-weight: 600; }
  .doc tr.row { transition: background 0.6s ease, color 0.6s ease, opacity 0.8s ease; }
  /* 中身を見せない行（同じページのほかの行のつもり。作り物の文字は出さない） */
  .doc tr.blank i { display: inline-block; height: 0.8vw; border-radius: 0.4vw; background: #ddd5c4; vertical-align: middle; }
  .doc.dim tr.row:not(.hit) { opacity: 0.28; }
  .doc tr.hit.lit { background: #ffe1a3; }
  .doc tr.hit.lit td:last-child { font-weight: 800; }
  svg.wire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.wire path { fill: none; stroke: var(--accent); stroke-width: 0.25vw; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s ease; }
  svg.wire path.on { stroke-dashoffset: 0; }
  .ans { position: absolute; right: 7vw; top: 22vh; width: 33vw; padding: 1.8vw 2vw; border-radius: 1vw; background: #fff; color: #1f2a33; box-shadow: 0 1.5vw 4vw rgba(0, 0, 0, 0.45); opacity: 0; transform: scale(0.94); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2, .8, .2, 1); }
  .ans.on { opacity: 1; transform: scale(1); }
  .ans .ak { margin: 0 0 0.6vw; font-size: max(13px, 0.95vw); color: #1f6f8b; font-weight: 700; letter-spacing: 0.08em; }
  .ans .at { margin: 0 0 1vw; font-size: max(20px, 1.55vw); line-height: 1.6; font-weight: 700; }
  .ans .at b { color: #1f6f8b; font-size: 1.25em; }
  .ans .src { display: inline-block; padding: 0.35vw 0.9vw; border-radius: 999px; background: #eef4f6; color: #2f5866; font-size: max(12px, 0.9vw); }

  /* grid：物差しのます目 */
  .gwrap { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: 78vw; }
  .ghead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.4vw; }
  .ghead .gt { font-size: max(26px, 2.2vw); font-weight: 700; }
  .ghead .gc { font-size: max(22px, 1.8vw); color: var(--sub); }
  .ghead .gc b { color: var(--ok); font-size: 1.5em; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 0.55vw; }
  .cell { height: 3.8vw; padding: 0.4vw; border: 1px solid var(--line); border-radius: 0.45vw; font-size: max(10px, 0.72vw); line-height: 1.35; color: var(--sub); overflow: hidden; transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease, transform 0.5s ease; }
  .cell.ok { background: rgba(95, 197, 155, 0.22); border-color: var(--ok); color: var(--ink); transform: scale(1.04); }
  .cell.none { border-style: dashed; border-color: rgba(244, 241, 234, 0.4); color: rgba(244, 241, 234, 0.5); }
  .glegend { display: flex; gap: 2vw; margin-top: 1.2vw; font-size: max(14px, 1.05vw); color: var(--sub); }
  .glegend i { display: inline-block; width: 1.1vw; height: 1.1vw; margin-right: 0.5vw; vertical-align: -0.15vw; border-radius: 0.25vw; border: 1px solid var(--ok); background: rgba(95, 197, 155, 0.22); }
  .glegend i.n { border: 1px dashed rgba(244, 241, 234, 0.5); background: none; }

  /* num：大きな数 ／ bar：棒が伸びる */
  .big { position: absolute; left: 0; right: 0; top: 30%; text-align: center; }
  .big .who { font-size: max(28px, 2.4vw); color: var(--sub); opacity: 0; transition: opacity 0.9s ease; }
  .big .v { margin: 1vw 0; font-size: max(120px, 10vw); font-weight: 800; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .big .v small { font-size: 0.35em; margin-left: 0.4vw; color: var(--sub); }
  .big .src { font-size: max(14px, 1vw); color: var(--sub); opacity: 0; transition: opacity 0.9s ease; }
  .big.on .who, .big.on .src { opacity: 1; }
  .bars { position: absolute; left: 12vw; right: 12vw; top: 30%; }
  .bars .bt { margin: 0 0 2vw; font-size: max(30px, 2.5vw); font-weight: 700; text-align: center; }
  .bar { position: relative; height: 5.4vw; margin: 1.4vw 0; border-radius: 0.6vw; background: rgba(244, 241, 234, 0.08); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(244, 241, 234, 0.35); transition: width 2.2s cubic-bezier(.2, .8, .2, 1); }
  .bar.b i { background: var(--accent); }
  .bar span { position: absolute; left: 1.4vw; top: 50%; transform: translateY(-50%); font-size: max(20px, 1.6vw); font-weight: 700; color: var(--ink); }
  .bar b { position: absolute; right: 1.4vw; top: 50%; transform: translateY(-50%); font-size: max(36px, 3vw); font-variant-numeric: tabular-nums; }
  .bars .src { margin-top: 1.6vw; text-align: center; font-size: max(14px, 1vw); color: var(--sub); }
  /* pages：防災計画のページが積み上がり、1枚に縮まる */
  .pile { position: absolute; left: 36%; top: 18vh; width: 22vw; height: 52vh; transform: translateX(-50%); transition: transform 0.9s cubic-bezier(.6, 0, .4, 1), opacity 0.9s ease; }
  .pile i { position: absolute; left: 0; right: 0; bottom: calc(var(--i) * 0.95vh); height: 2.6vh; border-radius: 0.3vw; background: var(--paper); box-shadow: 0 0.3vh 0.8vh rgba(0, 0, 0, 0.35); transform: translate(var(--x), -40vh) rotate(var(--r)); opacity: 0; transition: transform 0.45s cubic-bezier(.2, .8, .2, 1), opacity 0.3s ease; }
  .pile i.on { transform: translate(var(--x), 0) rotate(var(--r)); opacity: 1; }
  .pile.shrink { transform: translateX(-50%) scale(0.08); opacity: 0; }
  .pcount { position: absolute; left: 62vw; top: 34vh; transition: opacity 0.6s ease; }
  .pcount b { font-size: max(96px, 8vw); font-weight: 800; font-variant-numeric: tabular-nums; }
  .pcount small { margin-left: 0.6vw; font-size: max(28px, 2.4vw); color: var(--sub); }
  .pcount span { display: block; margin-top: 0.4vw; font-size: max(16px, 1.2vw); color: var(--sub); }
  .pcount.shrink { opacity: 0; }
  .ans.one { left: 50%; right: auto; top: 26vh; transform: translateX(-50%) scale(0.94); }
  .ans.one.on { transform: translateX(-50%) scale(1); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="badge" id="badge">演出（イメージ）</div>
<p class="cap" id="cap"><span class="s" id="cap-s"></span><span class="l" id="cap-l"></span></p>
<div class="start" id="start"><button type="button" id="go">始める</button></div>
<script src="scenes.js"></script>
</body>
</html>
